version: "3.9"
services:
  locust:
    build: .
    env_file:
      - .env
    environment:
      # fallbacks if .env not present
      - REPORTS_DIR=/app/reports
    ports:
      - "8089:8089"   # Locust web UI in dev
    volumes:
      - ./reports:/app/reports
      - ./specs:/app/specs
      - ./:/app       # optional: hot-reload python for dev convenience
    restart: unless-stopped